name: Aktualizovat TODO

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "!TODO.md"
      - "scripts/generate_todo.py"
      - ".github/workflows/update-todo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-todo
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v7

      - name: Vygenerovat TODO
        run: python3 scripts/generate_todo.py

      - name: Uložit změnu
        run: |
          if git diff --quiet -- TODO.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git commit -m "docs: aktualizovat TODO"
          git push
